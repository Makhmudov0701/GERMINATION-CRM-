<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ufq CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="style2.css">
  <link rel="stylesheet" href="extra.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="login" class="lg">
  <form id="loginForm" class="lg-box" novalidate>
    <div class="lg-brand">
      <svg viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><g fill="none" stroke="#E8A010" stroke-width="2.2" stroke-linejoin="round"><rect x="8" y="8" width="24" height="24"/><rect x="8" y="8" width="24" height="24" transform="rotate(45 20 20)"/></g><circle cx="20" cy="20" r="3.2" fill="#0F9D95"/></svg>
      Ufq CRM
    </div>
    <h1>Tizimga kirish</h1>
    <label for="loginEmail">Email</label>
    <input id="loginEmail" type="email" inputmode="email" autocomplete="username" autocapitalize="none">
    <label for="loginPassword">Parol</label>
    <input id="loginPassword" type="password" autocomplete="current-password">
    <p id="loginError" class="err" role="alert"></p>
    <button id="loginBtn" class="btn pri" type="submit">Kirish</button>
  </form>
</div>
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg viewBox="0 0 40 40" width="36" height="36" aria-hidden="true"><g fill="none" stroke="#F2B53A" stroke-width="2.2" stroke-linejoin="round"><rect x="8" y="8" width="24" height="24"/><rect x="8" y="8" width="24" height="24" transform="rotate(45 20 20)"/></g><circle cx="20" cy="20" r="3.2" fill="#2BC4BA"/></svg>
      <div><b>Ufq</b><span>Oʻquv markazi</span></div>
    </div>
    <nav class="sidenav" id="sidenav" aria-label="Asosiy menyu"></nav>
    <div class="side-foot">
      Maʼlumotlar Supabase'da saqlanadi.
      <br><button data-act="logout">Chiqish</button>
    </div>
  </aside>
  <main id="view" tabindex="-1"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Asosiy menyu"></nav>
<div id="mroot"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
window.addEventListener('error',function(e){alert('JS xato: '+e.message)});
window.addEventListener('unhandledrejection',function(e){alert('Xato: '+(e.reason&&e.reason.message||e.reason))});
</script>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="render.js"></script>
<script src="render2.js"></script>
<script src="forms.js"></script>
<script src="events.js"></script>
<script src="events2.js"></script>
<script src="auth.js"></script>
  <script src="roles.js"></script>
<script src="tg.js"></script>
<script src="receipt.js"></script>
<script src="csv.js"></script>
<script src="more.js"></script>
<script src="app.js"></script>
</body>
</html>
